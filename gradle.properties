org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# =====================================================================================
# Experiencia 3: conexión con la API
# =====================================================================================

# Valor INICIAL del interruptor "Modo local (sin servidor)" de la app (no es un modo fijo).
#   false (valor entregado) = la app parte en modo local: todo se guarda en Room, no hay red.
#   true                    = la app parte en modo servidor: usa lo que implementes en los TODO(E3-n).
# Una vez instalada, el modo se cambia desde el botón "Servidor" del login y esa elección se guarda en el
# dispositivo y manda sobre este valor (para volver a probar el valor inicial: borrar datos de la app).
# Cámbialo a true cuando termines la Parte 2 y 3 del enunciado, sincroniza Gradle y vuelve a ejecutar.
USAR_API=false

# Dirección inicial de la API (servidor local del aula). 10.0.2.2 es el computador visto desde el
# emulador de Android Studio. En un teléfono físico no hace falta recompilar: se cambia en la app
# (login > Servidor). Debe terminar en "/" y ser una dirección de la red local (RN-01, RNF-07).
API_BASE_URL=http://10.0.2.2:3000/

# Firma del APK release (opcional). NO escribir aquí claves reales. Usa keystore.properties
# (ver keystore.properties.example) o el gradle.properties personal (~/.gradle/gradle.properties):
#   LIBROMPAZ_STORE_FILE, LIBROMPAZ_STORE_PASSWORD, LIBROMPAZ_KEY_ALIAS, LIBROMPAZ_KEY_PASSWORD
